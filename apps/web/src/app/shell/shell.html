<a class="skip-link" href="#main" (click)="skipToMain($event)">Skip to main content</a>

<div class="shell" [class.rail-collapsed]="railCollapsed()">
  <header class="topbar">
    <tc-header-brand name="DONOVAN" href="/" [icon]="brandIcon" (tc-navigate)="onBrandNavigate($event)" />

    <tc-segmented-control class="mode" size="sm" variant="tray" value="assist" [options]="modes" aria-label="Mode" />

    <!-- Loaded once the page is idle, so the command menu isn't part of every page's first download. -->
    @defer (on idle) {
      <tc-command-menu
        class="search"
        layout="popover"
        label="Search Donovan"
        placeholder="Search chats, projects, artifacts…"
        filter="none"
        [groups]="searchGroups()"
        [loading]="searching()"
        (tc-query-change)="onQuery($event)"
        [onRun]="runCommand"
        [assistant]="false"
      />
    } @placeholder {
      <span class="search"></span>
    }

    <div class="actions">
      <tc-button variant="primary" size="md" label="New chat" [hideLabel]="compact()" (click)="newChat()">
        <span slot="icon" dnIcon="plus"></span>
      </tc-button>
      <tc-button variant="ghost" size="md" hideLabel [label]="themeLabel()" (click)="toggleTheme()">
        <span slot="icon" [dnIcon]="themeIconName()"></span>
      </tc-button>
      <tc-header-nav [user]="user()" [accountItems]="accountItems" (tc-account-select)="onAccountSelect($event)">
        <tc-notifications
          heading="Notifications"
          [items]="notificationItems()"
          [categories]="notificationCategories"
          [unreadCount]="notifications.unread()"
          [loading]="notifications.feed.isLoading() && !notifications.feed.hasValue()"
          (tc-open-change)="onNotificationsOpen($event)"
          (tc-read-change)="onNotificationRead($event)"
          (tc-mark-all-read)="onNotificationsAllRead($event)"
          (tc-dismiss)="onNotificationDismiss($event)"
          (tc-item-open)="onNotificationOpen($event)"
        />
      </tc-header-nav>
    </div>
  </header>

  <div class="rail">
    <tc-side-nav
      label="Assist"
      collapsible
      [collapsed]="railCollapsed()"
      [items]="navItems"
      [current]="currentArea()"
      (tc-navigate)="onNavigate($event)"
      (tc-collapsed-change)="onRailCollapsed($event)"
    />
    <!-- The chat list shows with the rail open, as in the prototype; folded, the Chats area is one click away. -->
    @if (!railCollapsed()) {
      @defer (on idle) {
        <nav class="rail-chats" aria-label="Chats">
          <tc-chat-history
            heading="Chats"
            [conversations]="conversations()"
            [value]="currentChat()"
            (tc-value-change)="openChat($event)"
            (tc-conversations-change)="keepConversations($event)"
            (tc-pin)="onPin($event)"
            (tc-rename)="onRename($event)"
            (tc-delete)="onDelete($event)"
            (tc-restore)="onRestore($event)"
            (tc-new-chat)="newChat()"
          />
        </nav>
      }
    }
  </div>

  <main id="main" class="content" tabindex="-1">
    <router-outlet />
  </main>
</div>

@defer (on idle) {
  <tc-toaster position="bottom-right" />
}
