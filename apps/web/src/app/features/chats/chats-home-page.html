<section class="home" aria-labelledby="home-heading">
  <p class="eyebrow">{{ date }}</p>
  <h1 id="home-heading">{{ heading() }}</h1>
  <p class="lede">
    Auto-routing is on. Donovan picks skills, tools and a model per message; override any of them in the composer.
  </p>

  <!-- The composer's tray of attached files says when one is removed (or brought back); it bubbles up to here. -->
  <div class="composer" (tc-items-change)="files.onChange($event)">
    <tc-chat-composer
      placeholder="Ask anything, or type / for a skill"
      [value]="value()"
      [models]="models"
      [model]="startModel()"
      hideConnectApps
      hideProject
      hideApproval
      [context]="files.context()"
      [onDictate]="dictate"
      [onSend]="send"
      (tc-attach)="files.pick()"
      disclaimer="AI-generated claims can be wrong. Verify before acting."
    />
    <div class="composer-meta">
      <tc-switch
        label="Calibrated"
        title="Label every claim and add verification checkpoints"
        [value]="calibrated()"
        (tc-value-change)="calibrated.set($event.detail.value === true)"
      />
      <tc-sensitivity-label-picker
        [fileName]="'this chat'"
        [options]="sensitivities"
        [value]="sensitivity()"
        (tc-value-change)="onSensitivity($event)"
      />
    </div>
  </div>

  <!-- tc-prompt-starters' own heading is an h3; this h2 keeps the page's outline in order. -->
  <h2 class="sr-only">Ways to start</h2>
  <tc-prompt-starters
    heading="Try one of these"
    [items]="starters"
    (tc-fill)="fill($event)"
    (tc-send)="sendStarter($event)"
  />
</section>
