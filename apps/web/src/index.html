<!doctype html>
<html lang="en" data-tc-look="clean">
  <head>
    <meta charset="utf-8" />
    <title>Donovan</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // The last theme this browser showed, applied before the app boots so the page doesn't flash (see core/theme.ts).
      try {
        var t = localStorage.getItem('donovan.theme');
        if (t === 'light' || t === 'dark' || t === 'system') document.documentElement.setAttribute('data-tc-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <dn-root></dn-root>
  </body>
</html>
