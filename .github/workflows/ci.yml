name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm install -g npm@11.21.2
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm install -g npm@11.21.2
      - run: npm ci
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: donovan, POSTGRES_PASSWORD: donovan, POSTGRES_DB: donovan }
        ports: ['5433:5432']
        options: --health-cmd "pg_isready -U donovan" --health-interval 5s --health-timeout 5s --health-retries 20
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
        env: { discovery.type: single-node, xpack.security.enabled: 'false', ES_JAVA_OPTS: -Xms1g -Xmx1g }
        ports: ['9201:9200']
        options: --health-cmd "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow" --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm install -g npm@11.21.2
      - run: npm ci
      - run: npm run build -w @donovan/contracts
      - run: npm run test:int

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm install -g npm@11.21.2
      # Postgres, Elasticsearch and Keycloak (with the donovan realm), as in local development.
      - run: docker compose up -d --wait
      - run: npm ci
      - run: npm run build -w @donovan/contracts && npm run build -w api
      - run: cp apps/api/.env.example apps/api/.env
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
      - if: failure()
        run: docker compose logs keycloak --tail 100
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # The one check the main ruleset requires, so adding or renaming jobs never needs a ruleset change.
  ci-ok:
    if: always()
    needs: [lint, unit, integration, e2e]
    runs-on: ubuntu-24.04
    steps:
      - run: '[ "${{ contains(needs.*.result, ''failure'') || contains(needs.*.result, ''cancelled'') || contains(needs.*.result, ''skipped'') }}" = "false" ]'
