name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm install -g npm@11.21.2
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      # The API's tests run untyped under Vitest; this checks them (and everything else) against the types.
      - run: npm run build -w @donovan/contracts
      - run: npm run typecheck -w api

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm install -g npm@11.21.2
      - run: npm ci
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: donovan, POSTGRES_PASSWORD: donovan, POSTGRES_DB: donovan }
        ports: ['5433:5432']
        options: --health-cmd "pg_isready -U donovan" --health-interval 5s --health-timeout 5s --health-retries 20
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
        env: { discovery.type: single-node, xpack.security.enabled: 'false', ES_JAVA_OPTS: -Xms1g -Xmx1g }
        ports: ['9201:9200']
        options: --health-cmd "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow" --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm install -g npm@11.21.2
      - run: npm ci
      - run: npm run build -w @donovan/contracts
      - run: npm run test:int

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm install -g npm@11.21.2
      # Postgres, Elasticsearch and Keycloak (with the donovan realm), as in local development.
      - run: docker compose up -d --wait
      - run: npm ci
      - run: npm run build -w @donovan/contracts && npm run build -w api
      - run: cp apps/api/.env.example apps/api/.env
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
      - if: failure()
        run: docker compose logs keycloak --tail 100
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # The one check the main ruleset requires, so adding or renaming jobs never needs a ruleset change.
  # The pilot's container images (deploy/pilot): they build, the API starts far enough to refuse an unsafe production
  # setting, and the web front's generated nginx config is valid.
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t donovan-api:ci .
      - run: docker build -f apps/web/Dockerfile -t donovan-web:ci .
      - name: Both run as a numeric user (Kubernetes' runAsNonRoot can't check a name)
        run: |
          for image in donovan-api:ci donovan-web:ci; do
            user=$(docker image inspect -f '{{.Config.User}}' "$image")
            echo "$image: $user"
            [[ "$user" =~ ^[1-9][0-9]*(:[0-9]+)?$ ]]
          done
      - name: The API loads, and production refuses local settings
        run: |
          out=$(docker run --rm -e DATABASE_URL=postgres://donovan:donovan@db/donovan -e ELASTICSEARCH_URL=http://es:9200 \
            -e OIDC_ISSUER=http://id/realms/x -e OIDC_AUDIENCE=donovan-api donovan-api:ci 2>&1 || true)
          echo "$out" | grep -q 'Production signs in over https' || { echo "$out"; exit 1; }
      - name: The web front's nginx config is valid
        run: >
          docker run --rm --read-only --tmpfs /tmp:uid=101,gid=101 --add-host api:127.0.0.1 -e OIDC_AUTHORITY=https://id.example.org/realms/x
          -e OIDC_CLIENT_ID=donovan-web -e API_UPSTREAM=http://api:3870 donovan-web:ci nginx -t

  ci-ok:
    if: always()
    needs: [lint, unit, integration, e2e, images]
    runs-on: ubuntu-24.04
    steps:
      - run: '[ "${{ contains(needs.*.result, ''failure'') || contains(needs.*.result, ''cancelled'') || contains(needs.*.result, ''skipped'') }}" = "false" ]'
