# Applies pending database migrations before a rollout (the API refuses to migrate on start in production). Same
# image as the API, so it carries exactly the migrations that release expects.
apiVersion: batch/v1
kind: Job
metadata:
  name: donovan-migrate
  namespace: donovan
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: donovan-migrate }
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: registry.example.com/donovan-api:REPLACE_WITH_RELEASE
          command: ['node', 'dist/migrate.js']
          envFrom:
            - secretRef: { name: donovan-api-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
