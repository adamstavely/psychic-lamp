apiVersion: apps/v1
kind: Deployment
metadata:
  name: donovan-web
  namespace: donovan
spec:
  replicas: 2
  selector:
    matchLabels: { app: donovan-web }
  template:
    metadata:
      labels: { app: donovan-web }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 330
      containers:
        - name: web
          image: registry.example.com/donovan-web:REPLACE_WITH_RELEASE
          ports: [{ containerPort: 8080, name: http }]
          envFrom:
            - configMapRef: { name: donovan-web }
          readinessProbe:
            httpGet: { path: /config.json, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: donovan-web
  namespace: donovan
spec:
  selector: { app: donovan-web }
  ports: [{ port: 80, targetPort: http, name: http }]
